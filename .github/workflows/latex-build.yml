name: Build and publish

on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-book:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repository
        uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 0

      - name: Find changed tex files
        id: changed-tex
        shell: bash
        run: |
          set -euo pipefail

          cd repo

          BEFORE="${{ github.event.before || '' }}"
          AFTER="${{ github.sha }}"

          # For manual runs or first push to a branch, build all non-draft tex files.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0{40}$ ]]; then
            briefs_tex="$(find briefs -maxdepth 1 -name '*.tex' ! -name '*.draft.tex' -printf '%f\n' | sort)"
            bareminima_tex="$(find bareminima -maxdepth 1 -name '*.tex' ! -name '*.draft.tex' -printf '%f\n' | sort)"
          else
            briefs_tex="$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'briefs/*.tex' \
              | sed 's#^briefs/##' \
              | awk '!/\.draft\.tex$/' \
              | sort)"

            bareminima_tex="$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'bareminima/*.tex' \
              | sed 's#^bareminima/##' \
              | awk '!/\.draft\.tex$/' \
              | sort)"
          fi

          echo "Changed briefs tex files:"
          echo "$briefs_tex"

          echo "Changed bareminima tex files:"
          echo "$bareminima_tex"

          {
            echo "briefs_tex<<EOF"
            echo "$briefs_tex"
            echo "EOF"

            echo "bareminima_tex<<EOF"
            echo "$bareminima_tex"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile briefs
        if: steps.changed-tex.outputs.briefs_tex != ''
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: repo/briefs
          root_file: ${{ steps.changed-tex.outputs.briefs_tex }}

      - name: Compile bareminima
        if: steps.changed-tex.outputs.bareminima_tex != ''
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: repo/bareminima
          root_file: ${{ steps.changed-tex.outputs.bareminima_tex }}

      - name: Upload to autogen repository
        run: |
          # Clone tools repository (it has the script)
          git clone https://github.com/assumptionsofphysics/tools tools
          # Clone autogen repository
          git clone https://gcarcassi:${{ secrets.AUTOGEN_TOKEN }}@github.com/assumptionsofphysics/autogen autogen
          ls -R
          # Run the script
          python tools/problem-scraper/technicalBriefIndex.py autogen/briefs/briefs.json repo/briefs/*.tex 
          python tools/problem-scraper/bareMinimumIndex.py autogen/bareminima/bareminima.json repo/bareminima/*.tex 
          cd repo
          find . -type f -iname '*.pdf' -print0 | rsync -0a --files-from=- --remove-source-files ./ ../autogen/
          cd ../autogen
          ls -R
          git add '**/*.pdf'
          git add 'briefs/briefs.json'
          git add 'bareminima/bareminima.json'
          # Commit and push only if there were changes
          if ! git diff --cached --quiet; then
            git config user.name "gcarcassi[bot]"
            git config user.email "gabriele.carcassi@gmail.com"
            git pull
            git commit -m "Updating community articles"
            git push
          else
            echo "No changes to commit."
          fi
